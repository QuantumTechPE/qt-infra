# Clúster CERT. Reemplaza las IPs por las de tus servidores/VMs.
all:
  vars:
    cluster_env: cert
    ansible_user: ubuntu
    # Reserva por nodo para el SO y k3s (por defecto: group_vars/all.yml). Ver docs/recursos.md
    # k3s_system_reserved: "cpu=500m,memory=1Gi"
    # k3s_kube_reserved: "cpu=500m,memory=1Gi"
    # ingress_domain: cert.miempresa.local
  children:
    k3s_server:
      hosts:
        cert-cp-1:
          ansible_host: 192.168.20.11
    k3s_agent:
      hosts:
        cert-w-1:
          ansible_host: 192.168.20.21
