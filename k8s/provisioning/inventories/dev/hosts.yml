# Clúster DEV. Reemplaza las IPs por las de tus servidores/VMs.
# Requisitos de cada nodo: Linux con systemd, acceso SSH con la llave de
# platform/.secrets/ssh/id_ed25519 (qt.ps1 ssh-key) y sudo sin contraseña.
all:
  vars:
    cluster_env: dev
    ansible_user: ubuntu
    # Reserva por nodo para el SO y k3s (por defecto: group_vars/all.yml). Ver docs/recursos.md
    # k3s_system_reserved: "cpu=500m,memory=1Gi"
    # k3s_kube_reserved: "cpu=500m,memory=1Gi"
    # Dominio del Ingress: por defecto <IP del primer control-plane>.nip.io
    # (DNS wildcard público y gratis). Con DNS propio: dev.miempresa.local
    # ingress_domain: dev.miempresa.local
  children:
    k3s_server:
      hosts:
        dev-cp-1:
          ansible_host: 192.168.10.11
    k3s_agent:
      hosts:
        dev-w-1:
          ansible_host: 192.168.10.21
