# Clúster PROD: 3 control-plane (etcd embebido en HA) + workers.
# Con menos máquinas, deja un solo control-plane (sin HA).
all:
  vars:
    cluster_env: prod
    ansible_user: ubuntu
    # Reserva por nodo para el SO y k3s (por defecto: group_vars/all.yml). Ver docs/recursos.md
    # k3s_system_reserved: "cpu=500m,memory=1Gi"
    # k3s_kube_reserved: "cpu=500m,memory=1Gi"
    # ingress_domain: miempresa.com
  children:
    k3s_server:
      hosts:
        prod-cp-1:
          ansible_host: 192.168.30.11
        prod-cp-2:
          ansible_host: 192.168.30.12
        prod-cp-3:
          ansible_host: 192.168.30.13
    k3s_agent:
      hosts:
        prod-w-1:
          ansible_host: 192.168.30.21
        prod-w-2:
          ansible_host: 192.168.30.22
