# =============================================================================
# Aprovisiona un clúster k3s (un ambiente) en servidores/VMs propios.
#   qt.ps1 k8s-provision dev     (ejecuta este playbook en el toolbox)
#
# Idempotente: volver a ejecutarlo no reinstala si la versión ya coincide;
# cambiar k3s_version en group_vars/all.yml actualiza el clúster nodo a nodo.
# =============================================================================

- name: Verificaciones previas
  hosts: k3s_server:k3s_agent
  gather_facts: true
  become: true
  tasks:
    - name: Sistema soportado (Linux con systemd, x86_64/arm64)
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
          - ansible_service_mgr == "systemd"
          - ansible_architecture in ["x86_64", "aarch64"]
        fail_msg: "k3s requiere Linux con systemd en x86_64/arm64"

    - name: Herramientas base
      ansible.builtin.package:
        name: [curl, ca-certificates]
        state: present

    - name: Instalador oficial de k3s ({{ k3s_version }})
      ansible.builtin.get_url:
        url: "{{ k3s_install_script_url }}"
        dest: /usr/local/share/k3s-install.sh
        mode: "0755"

    - name: Versión de k3s instalada
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: k3s_installed
      changed_when: false
      failed_when: false

    - name: ¿Hay que instalar/actualizar?
      ansible.builtin.set_fact:
        k3s_needs_install: "{{ k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout }}"

- name: Control-plane
  hosts: k3s_server
  become: true
  serial: 1 # el primero inicializa el clúster antes de que se unan los demás
  tasks:
    - name: Directorio de configuración
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configuración de k3s (server)
      ansible.builtin.template:
        src: templates/k3s-server.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      register: server_config

    - name: Instalar k3s server
      ansible.builtin.command: /usr/local/share/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
      when: k3s_needs_install | bool
      changed_when: true

    - name: Reiniciar k3s si cambió la configuración
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
      when: server_config.changed and not (k3s_needs_install | bool)

    - name: Esperar a que el nodo esté Ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node/{{ ansible_nodename }} --timeout=300s
      changed_when: false
      retries: 5
      delay: 10
      register: node_ready
      until: node_ready.rc == 0

- name: Workers
  hosts: k3s_agent
  become: true
  tasks:
    - name: Directorio de configuración
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configuración de k3s (agent)
      ansible.builtin.template:
        src: templates/k3s-agent.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      register: agent_config

    - name: Instalar k3s agent
      ansible.builtin.command: /usr/local/share/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: agent
      when: k3s_needs_install | bool
      changed_when: true

    - name: Reiniciar k3s-agent si cambió la configuración
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: restarted
      when: agent_config.changed and not (k3s_needs_install | bool)

- name: Kubeconfig del clúster
  hosts: k3s_server[0]
  become: true
  tasks:
    - name: Esperar a que todos los nodos estén Ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

    - name: Leer kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Guardar platform/.secrets/kubeconfig-{{ cluster_env }}
      ansible.builtin.copy:
        content: >-
          {{ kubeconfig_raw.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ k3s_api_endpoint ~ ':6443')
             | replace(': default', ': qt-' ~ cluster_env) }}
        dest: "{{ secrets_dir }}/kubeconfig-{{ cluster_env }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Nodos del clúster
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: nodes
      changed_when: false

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ nodes.stdout_lines }}"
