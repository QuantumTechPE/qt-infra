[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
private_key_file = /secrets/ssh/id_ed25519
forks = 10

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/secrets/ssh/known_hosts
