{{- if and (include "qt-service.enabled" .) .Values.secrets.enabled }}
# Secret sincronizado desde Vault por External Secrets Operator.
# Cada clave de secret/{{ include "qt-service.vaultKey" . }} se vuelve una variable de entorno.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qt-service.name" . }}
  labels:
    {{- include "qt-service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secrets.store }}
  target:
    name: {{ include "qt-service.name" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ include "qt-service.vaultKey" . }}
{{- end }}
