{{- if include "qt-service.enabled" . }}
{{- /* Valores de la plataforma + config del servicio (el servicio tiene prioridad) */ -}}
{{- $platform := dict "QT_SERVICE" (include "qt-service.name" .) "QT_ENVIRONMENT" .Values.environment }}
{{- /* Versión desplegada (tag de la imagen: vX.Y.Z-rc.N en CERT/PROD, sha-<commit> en DEV) */ -}}
{{- with .Values.image.tag }}{{- $_ := set $platform "QT_VERSION" . }}{{- end }}
{{- /* Trazas OpenTelemetry → Tempo del clúster (Quarkus las exporta por OTLP) */ -}}
{{- if .Values.tracing.enabled }}
{{- $_ := set $platform "QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT" .Values.tracing.endpoint }}
{{- $_ := set $platform "OTEL_RESOURCE_ATTRIBUTES" (printf "deployment.environment=%s" .Values.environment) }}
{{- end }}
{{- $data := merge (deepCopy (.Values.config | default dict)) $platform }}
# ConfigMap del ambiente: valores NO secretos → variables de entorno.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qt-service.name" . }}-config
  labels:
    {{- include "qt-service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
