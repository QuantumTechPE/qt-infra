{{- if include "qt-service.enabled" . }}
# Cuenta propia por servicio, sin token montado (no habla con la API de Kubernetes).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qt-service.name" . }}
  labels:
    {{- include "qt-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
