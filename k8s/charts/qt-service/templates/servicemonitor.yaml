{{- if and (include "qt-service.enabled" .) .Values.metrics.enabled .Values.observability.grafana }}
# Prometheus (kube-prometheus-stack del clúster) recoge las métricas del servicio.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "qt-service.name" . }}
  labels:
    {{- include "qt-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "qt-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.interval }}
      relabelings:
        - targetLabel: environment
          replacement: {{ .Values.environment }}
{{- end }}
