{{- $v := .Values.vault }}
{{- if not (and $v.server $v.caBundle $v.mountPath) }}
{{- fail "vault.server, vault.caBundle y vault.mountPath son obligatorios" }}
{{- end }}
# Conexión del clúster con Vault: External Secrets se autentica con el
# ServiceAccount de su namespace (auth Kubernetes "{{ $v.mountPath }}") y solo
# puede leer secret/apps/*/{{ .Values.environment }}.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: qt-platform
    qt.platform/environment: {{ .Values.environment }}
spec:
  provider:
    vault:
      server: {{ $v.server | quote }}
      path: secret
      version: v2
      caBundle: {{ $v.caBundle | quote }}
      auth:
        kubernetes:
          mountPath: {{ $v.mountPath | quote }}
          role: {{ $v.role | quote }}
          serviceAccountRef:
            name: {{ $v.serviceAccount.name }}
            namespace: {{ $v.serviceAccount.namespace }}
            # Token con audiencia exclusiva para Vault (el rol la exige)
            audiences:
              - vault
