# Gitleaks: reglas por defecto + excepciones explícitas y justificadas.
title = "QT gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Valores de ejemplo, credenciales exclusivas de tests y lockfiles"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)package-lock\.json$''',
  '''^k8s/charts/.+/ci/.+\.yaml$''',
]
regexes = [
  '''test-only-api-key''',
  '''dev-only-api-key''',
]

[[allowlists]]
description = "Credencial POR DEFECTO y pública de SonarQube: el bootstrap la detecta y la reemplaza por una aleatoria guardada en Vault"
condition = "AND"
regexTarget = "line"
paths = ['''^platform/scripts/sonar-bootstrap\.sh$''']
regexes = ['''curl .*-u admin:admin ''']
