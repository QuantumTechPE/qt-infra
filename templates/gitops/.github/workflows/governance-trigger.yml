# Disparador liviano del gobierno de merges (sin permisos ni secretos).
# Su única función es activar governance.yml, que corre con el código de main.
name: Governance Trigger

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  trigger:
    name: Notificar evento de revisión
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evento
        env:
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}/${{ github.event.action }}
        run: |
          echo "PR #${PR} -> ${EVENT}"
