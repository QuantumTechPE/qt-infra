# External Secrets Operator: sincroniza secretos de Vault → Secrets de Kubernetes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        # Recursos de este ambiente: ver docs/recursos.md de qt-infra
        resources: __R_ESO__
        webhook:
          resources: __R_ESO__
        certController:
          resources: __R_ESO__
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      # Reintentos ilimitados: en un clúster nuevo los webhooks de External Secrets/Kyverno
      # tardan en estar listos; Argo CD no reintenta solo una revisión fallida.
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
