# Una aplicación de Argo CD por cada carpeta apps/<servicio>/__ENV__ de este repo.
# Dar de alta un microservicio = crear esa carpeta (lo hace qt-infra/scripts/new-service.sh).
# apps/<servicio>/__ENV__/ tiene dos archivos de valores:
#   values.yaml   snapshot TÉCNICO (recursos, HPA, imagen): lo escribe el CD del servicio
#   config.yaml   CONFIGURACIÓN del ambiente (ConfigMaps, secretos declarados): la
#                 escribe el CICD de qt-config (y también cada promoción del servicio)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: __GIT_BASE_URL__/__GITOPS_REPO__.git
        revision: master
        directories:
          - path: apps/*/__ENV__
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-__ENV__'
      labels:
        qt.platform/service: '{{ index .path.segments 1 }}'
        qt.platform/environment: __ENV__
    spec:
      project: services
      sources:
        - repoURL: __GIT_BASE_URL__/__INFRA_REPO__.git
          targetRevision: master
          path: k8s/charts/qt-service
          helm:
            releaseName: '{{ index .path.segments 1 }}'
            valueFiles:
              - '$values/{{ .path.path }}/values.yaml'
              - '$values/{{ .path.path }}/config.yaml'
            # Un servicio recién dado de alta aún no tiene config.yaml
            ignoreMissingValueFiles: true
            # Los fija el clúster (no el servicio): ambiente y dominio del Ingress
            parameters:
              - name: environment
                value: __ENV__
              - name: global.ingressDomain
                value: __INGRESS_DOMAIN__
        - repoURL: __GIT_BASE_URL__/__GITOPS_REPO__.git
          targetRevision: master
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          # La reversión de un servicio que aún no tenía versión lo RETIRA (sin digest
          # el chart no genera recursos): Argo CD debe poder sincronizar a "vacío".
          allowEmpty: true
        syncOptions:
          - CreateNamespace=true
          # ServiceMonitor/ExternalSecret dependen de CRDs de los addons
          - SkipDryRunOnMissingResource=true
        managedNamespaceMetadata:
          labels:
            qt.platform/managed: "true"
            qt.platform/environment: __ENV__
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        retry:
          # Reintentos ilimitados: en un clúster nuevo los webhooks de External Secrets/Kyverno
          # tardan en estar listos; Argo CD no reintenta solo una revisión fallida.
          limit: -1
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
