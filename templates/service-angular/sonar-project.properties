# SonarQube (servidor local de la plataforma)
sonar.projectKey=qt-template-angular
sonar.projectName=QT Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.exclusions=**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts

# Cobertura generada por `npm run test:ci` (Vitest + v8)
sonar.javascript.lcov.reportPaths=coverage/qt-template-angular/lcov.info

# El pipeline falla si el Quality Gate no pasa
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
