# CICD QA · merge a master = CONGELAMIENTO:
#   build, escaneos, imagen firmada → release del cambio (vX.Y.Z-rc.N) y release
#   de reversión → QA: congela → revierte → recongela → issue de pase.
# La lógica vive en __INFRA_REPO__; los despliegues los ejecuta Argo CD.
name: CICD QA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cada congelamiento corre completo (no se cancela)
concurrency:
  group: cicd-qa-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cicd:
    name: CICD
    uses: __GITHUB_OWNER__/__INFRA_REPO__/.github/workflows/service-cd.yml@master
    with:
      stack: __STACK__
      channel: freeze
    permissions:
      contents: write
      issues: read
      security-events: write
      id-token: write
      packages: write
      attestations: write
