# Convenciones del PR. Check requerido: "PR Lint / Convenciones".
name: PR Lint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-lint:
    name: PR Lint
    uses: __GITHUB_OWNER__/__INFRA_REPO__/.github/workflows/service-pr-lint.yml@main
