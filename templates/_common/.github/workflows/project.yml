# Historia de usuario ↔ tablero de la organización ↔ rama/PR.
# pull_request_target: corre con el código de master, nunca con el del PR.
name: Project Automation

on:
  issues:
    types: [opened, reopened, assigned, closed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: project-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  project:
    name: Tablero
    if: >-
      vars.PROJECT_NUMBER != '' &&
      (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/rechazar'))
    uses: __GITHUB_OWNER__/__INFRA_REPO__/.github/workflows/service-project.yml@master
    permissions:
      contents: read
      id-token: write
