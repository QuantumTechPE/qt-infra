# CodeQL (SAST semántico; gratis en repos públicos). El ruleset de master exige
# que no haya alertas de seguridad HIGH o superiores.
name: CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    uses: __GITHUB_OWNER__/__INFRA_REPO__/.github/workflows/service-codeql.yml@master
    with:
      languages: '__CODEQL_LANGUAGES__'
    permissions:
      contents: read
      actions: read
      security-events: write
