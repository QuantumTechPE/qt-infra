# CICD QA REV · "/rechazar <motivo>" en el issue de pase: QA rechaza el release,
# QA vuelve a lo que corre en producción (release de reversión) y se recrean
# las ramas qt/<n> para corregir.
name: CICD QA REV

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pase-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reversion:
    name: CICD QA REV
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'pase') &&
      startsWith(github.event.comment.body, '/rechazar')
    uses: __GITHUB_OWNER__/__INFRA_REPO__/.github/workflows/service-pase.yml@master
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: write
      attestations: read
