# =============================================================================
# qt-template-quarkus · QA  (se despliega con cada release vX.Y.Z)
# =============================================================================

# ---- Plan de recursos por pod -------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

# ---- Escalado horizontal (HPA) ------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 0
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: false

# ---- ConfigMap del ambiente → variables de entorno ----------------------------
config: {}
