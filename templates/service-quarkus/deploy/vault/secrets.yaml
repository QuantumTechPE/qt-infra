# =============================================================================
# Secretos del microservicio en HashiCorp Vault (KV v2), separados por ambiente:
#
#   secret/apps/qt-template-quarkus/dev
#   secret/apps/qt-template-quarkus/qa
#   secret/apps/qt-template-quarkus/prod
#
# Aquí solo se declaran los NOMBRES, nunca los valores. Cada clave llega al pod
# como variable de entorno (Vault → External Secrets → Secret de Kubernetes) y
# Quarkus la mapea sola: DB_PASSWORD → db.password, o úsala con ${DB_PASSWORD}.
#
#   generate: true   la plataforma crea un valor aleatorio DISTINTO por ambiente
#                    al dar de alta el servicio (API keys internas, claves de cifrado)
#   generate: false  lo carga un admin por ambiente:
#                    .\qt.ps1 secret-set qt-template-quarkus <dev|qa|prod> <CLAVE>
#
# Cada clúster solo puede leer los secretos de su ambiente.
# =============================================================================
keys:
  - name: APP_EXAMPLE_SECRET
    description: Ejemplo. Reemplázalo por los secretos reales del servicio.
    generate: true

  # - name: DB_PASSWORD
  #   description: Contraseña de la base de datos del ambiente
  #   generate: false
