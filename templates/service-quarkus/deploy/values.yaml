# =============================================================================
# qt-template-quarkus · valores COMUNES a dev, cert y prod
# (chart qt-infra/k8s/charts/qt-service; referencia completa en su values.yaml)
#
# Aquí va SOLO lo técnico (puerto, probes, Ingress, métricas); el plan de
# recursos de cada ambiente, en values-<ambiente>.yaml. Al promover, el pipeline
# lo compone en qt-gitops/apps/qt-template-quarkus/<ambiente>/values.yaml.
#
# La CONFIGURACIÓN de cada ambiente (variables, application.properties y nombres
# de secretos) vive en el repo qt-config: dev/, cert/ y prod/<nombre-del-repo>-<ambiente>.yaml.
# =============================================================================

containerPort: 8080

probes:
  liveness:
    path: /q/health/live
    initialDelaySeconds: 15
  readiness:
    path: /q/health/ready
    initialDelaySeconds: 5

# Ruta pública: <subdomain>.<dominio del clúster><path>
ingress:
  enabled: true
  subdomain: qt
  path: /api

# Métricas Micrometer → Prometheus/Grafana del ambiente
metrics:
  enabled: true
  path: /q/metrics

# Observabilidad (en los 3 ambientes; para uno solo, ponlo en values-<ambiente>.yaml)
observability:
  # Trazas OpenTelemetry → Tempo. false: no se generan trazas (ahorra CPU/memoria)
  tracing: true
  # Métricas y logs visibles en Grafana. false: el servicio no aparece en Grafana
  grafana: true

# Los archivos de qt-config (files:) se montan aquí: Quarkus lee ./config/ (el
# WORKDIR de la imagen es /deployments) con prioridad sobre el
# application.properties empaquetado.
configFiles:
  mountPath: /deployments/config

# Su configuración: qt-config <ambiente>/<nombre-del-repo>-<ambiente>.yaml
# (dev ← rama pre-develop, cert ← develop, prod ← master).
# Lo que ESTA versión necesita encontrar en qt-config de cada ambiente. DEV, el
# congelamiento y el pase lo verifican ANTES de desplegar: si falta algo, se
# frena con un mensaje claro. Agrega aquí cada variable, archivo o secreto nuevo
# que el código empiece a usar (y créalo en qt-config antes de desplegar).
requiredConfig:
  env: []
  files: [application.properties]
  secrets: []
