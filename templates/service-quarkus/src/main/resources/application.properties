# =============================================================================
# Configuración BASE del microservicio (común a todos los ambientes).
#
# Por ambiente (dev | qa | prod) se sobrescribe SIN recompilar con:
#   deploy/config/<ambiente>/application.properties  → ConfigMap montado en
#                                                       /deployments/config/ (mayor prioridad)
#   deploy/values-<ambiente>.yaml  (config:)          → variables de entorno
#   deploy/vault/secrets.yaml                         → secretos de Vault como variables de entorno
# Prioridad: variables de entorno > config/application.properties > este archivo.
# =============================================================================
quarkus.application.name=qt-template-quarkus

# Prefijo público de la API (lo enruta el Ingress). Propiedad de BUILD: si hay
# varios microservicios en el mismo host, cada uno usa su propio prefijo.
quarkus.http.root-path=/api

# Health, métricas y Dev UI fuera del prefijo público: /q/health, /q/metrics.
# Los usan los probes de Kubernetes y Prometheus; el Ingress no los expone.
quarkus.http.non-application-root-path=/q

# Ambiente lógico. En el clúster llega como QT_ENVIRONMENT (lo pone la plataforma).
qt.environment=local

# Versión desplegada. En el clúster llega como QT_VERSION (tag de la imagen:
# vX.Y.Z-rc.N en QA/PROD, sha-<commit> en DEV); en local, la del pom.
qt.version=${quarkus.application.version}

# OpenAPI / Swagger UI solo en desarrollo local
quarkus.smallrye-openapi.info-title=API qt-template-quarkus
quarkus.swagger-ui.always-include=false
quarkus.smallrye-health.ui.enabled=false

# Logs
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# -----------------------------------------------------------------------------
# Perfiles de Quarkus: %dev = ./mvnw quarkus:dev (tu máquina), %test = tests.
# (No confundir con el AMBIENTE dev del clúster: ese usa deploy/config/dev/)
# -----------------------------------------------------------------------------
%dev.quarkus.log.category."com.qt".level=DEBUG
%test.qt.environment=test
