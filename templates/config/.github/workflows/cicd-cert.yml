# CICD CERT · merge en develop → el clúster cert toma cert/<servicio>-cert.yaml:
# secretos declarados → Vault, config.yaml → qt-gitops, Argo CD Synced + Healthy.
name: CICD CERT

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cd:
    name: CICD
    uses: __GITHUB_OWNER__/__INFRA_REPO__/.github/workflows/config-cd.yml@master
    with:
      environment: cert
    permissions:
      contents: read
      id-token: write
