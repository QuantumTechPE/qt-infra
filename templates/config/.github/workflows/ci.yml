# CI de qt-config (cada PR): orden de promoción, estructura, formato, render con
# el deploy/ real de cada microservicio y Gitleaks. Check requerido: "CI / Gate".
name: CI

on:
  pull_request:
    branches: [pre-develop, develop, master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: __GITHUB_OWNER__/__INFRA_REPO__/.github/workflows/config-ci.yml@master
    permissions:
      contents: read
      security-events: write
