# Interno: promoción GitOps de una imagen a un ambiente (dev | cert | prod).
#
#   1. Verifica firma cosign: la imagen debe venir de qt-infra/_image.yml,
#      construida desde la rama de ESTE run (qt/<n> en DEV, master en CERT/PROD).
#      Digest vacío = RETIRO (reversión de un servicio que aún no tenía versión).
#   2. Verifica la configuración del ambiente en qt-config (archivo + requiredConfig).
#   3. Escribe el digest en qt-gitops/apps/<servicio>/<ambiente>/values.yaml y la
#      configuración vigente en config.yaml (token de la App acotado al repo GitOps).
#   4. Espera a que Argo CD del clúster quede Synced + Healthy.
#      Si falla, revierte el commit GitOps (rollback automático).
#
# El job usa el environment de GitHub del mismo nombre (dev solo acepta ramas
# qt/*; cert y prod solo master). La aprobación de producción se da al agendar el
# pase (environment pase-produccion), no aquí.
name: _promote

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        description: ghcr.io/<org>/<servicio>
        type: string
        required: true
      digest:
        description: sha256:... (vacío = retiro del servicio)
        type: string
        default: ""
      ref:
        description: Commit cuyo deploy/ se despliega (por defecto, el del run)
        type: string
        default: ""
      version:
        type: string
        default: ""
      wait:
        description: Esperar a Argo CD (Synced + Healthy)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  promote:
    name: GitOps → ${{ inputs.environment }}
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 25
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: promote-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write
    env:
      SERVICE: ${{ github.event.repository.name }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      VERSION: ${{ inputs.version }}
      GITOPS_REPO: ${{ github.repository_owner }}/${{ vars.GITOPS_REPO || 'qt-gitops' }}
    steps:
      - name: Código de la plataforma (qt-infra)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github
          persist-credentials: false

      - name: Configuración del servicio (deploy/ en el commit que se despliega)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: .service
          sparse-checkout: deploy
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login en GHCR (paquetes privados)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar firma y procedencia de la imagen
        if: inputs.digest != ''
        env:
          INFRA_REPO: ${{ job.workflow_repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Firma cosign emitida por el workflow corporativo de imágenes
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github\.com/${INFRA_REPO}/\.github/workflows/_image\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          # Procedencia SLSA: construida por ese workflow, desde la rama de ESTE run
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${INFRA_REPO}/.github/workflows/_image.yml" \
            --source-ref "${GITHUB_REF}" > /dev/null
          echo "🔏 Firma y procedencia válidas: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Token de la GitHub App (solo repo GitOps)
        id: app
        uses: ./.qt-infra/.github/actions/github-app-token
        with:
          vault-addr: ${{ vars.VAULT_ADDR }}
          vault-audience: ${{ vars.VAULT_AUDIENCE }}
          vault-ca: ${{ vars.VAULT_CA_B64 }}
          vault-role: gha-promote-${{ inputs.environment }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.GITOPS_REPO || 'qt-gitops' }}

      - name: Credenciales de Argo CD del ambiente (Vault)
        if: inputs.wait
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          caCertificate: ${{ vars.VAULT_CA_B64 }}
          method: jwt
          path: jwt-github
          role: gha-promote-${{ inputs.environment }}
          jwtGithubAudience: ${{ vars.VAULT_AUDIENCE }}
          secrets: |
            secret/data/platform/argocd/${{ inputs.environment }} url | ARGOCD_URL ;
            secret/data/platform/argocd/${{ inputs.environment }} token | ARGOCD_TOKEN

      # La versión se despliega con la configuración VIGENTE de su ambiente en
      # qt-config (dev ← pre-develop, cert ← develop, prod ← master). Si falta el
      # archivo o algo de requiredConfig, se frena aquí, antes de tocar GitOps.
      - name: Configuración del ambiente (qt-config)
        id: config
        if: inputs.digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_REPO: ${{ github.repository_owner }}/${{ vars.CONFIG_REPO || 'qt-config' }}
        run: |
          source .qt-infra/.github/scripts/lib-gh.sh
          source .qt-infra/.github/scripts/config-lib.sh
          branch="$(config_branch "$ENVIRONMENT")"
          path="$(config_path "$SERVICE" "$ENVIRONMENT")"
          cfg="$RUNNER_TEMP/qt-config.yaml"
          if ! config_fetch "$CONFIG_REPO" "$SERVICE" "$ENVIRONMENT" "$cfg"; then
            echo "::error::No existe ${path} en la rama ${branch} de ${CONFIG_REPO}: créalo con un PR en qt-config antes de desplegar en ${ENVIRONMENT}."
            exit 1
          fi
          bash .qt-infra/.github/scripts/config-check.sh .service/deploy/values.yaml "$cfg" "$ENVIRONMENT" "$SERVICE"
          sha="$(gh api "repos/${CONFIG_REPO}/commits/${branch}" --jq .sha)"
          SOURCE="${CONFIG_REPO}@${sha:0:7} (${branch}:${path})" \
            bash .qt-infra/.github/scripts/config-render.sh "$cfg" "$RUNNER_TEMP/config-values.yaml"
          echo "values=$RUNNER_TEMP/config-values.yaml" >> "$GITHUB_OUTPUT"
          echo "🧩 Configuración: ${CONFIG_REPO} ${branch}:${path} (${sha:0:7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit en GitOps (snapshot de deploy/ + imagen + configuración)
        id: gitops
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SERVICE_DIR: .service
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          CONFIG_VALUES: ${{ steps.config.outputs.values }}
        run: bash .qt-infra/.github/scripts/gitops-promote.sh promote

      - name: Esperar a Argo CD (Synced + Healthy)
        id: wait
        if: inputs.wait
        env:
          APP: ${{ github.event.repository.name }}-${{ inputs.environment }}
          REVISION: ${{ steps.gitops.outputs.revision }}
        run: bash .qt-infra/.github/scripts/argocd-wait.sh

      - name: Rollback GitOps
        if: failure() && steps.wait.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REVISION: ${{ steps.gitops.outputs.revision }}
        run: bash .qt-infra/.github/scripts/gitops-promote.sh revert "$REVISION"
