name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    uses: ./.github/workflows/service-codeql.yml
    with:
      languages: '["java-kotlin","javascript-typescript","actions"]'
    permissions:
      contents: read
      actions: read
      security-events: write
