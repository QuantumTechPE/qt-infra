# Interno: imagen de contenedor del microservicio ("build once, deploy many").
#
#   1. Descarga el artefacto compilado y VERIFICA su SHA-256.
#   2. Construye la imagen (sin recompilar) y, si push=true, la publica en GHCR.
#   3. Escanea con Trivy (gate HIGH/CRITICAL con fix) y genera el SBOM CycloneDX.
#   4. Solo si pasó: firma keyless con cosign + attestations SLSA y SBOM.
#
# La identidad de la firma es ESTE archivo (qt-infra/_image.yml): Kyverno en los
# clústeres y el paso de promoción solo aceptan imágenes firmadas por él.
name: _image

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      working-directory:
        type: string
        default: "."
      push:
        type: boolean
        default: false
      version:
        description: Versión semántica (solo en releases)
        type: string
        default: ""
      artifact-prefix:
        type: string
        default: app
      image-name:
        description: Nombre de la imagen sin registry (por defecto, el repo)
        type: string
        default: ""
      scan:
        description: Escaneo de CVEs y quality gate (true en CI y DEV; false en el congelamiento)
        type: boolean
        default: true
    outputs:
      image:
        description: ghcr.io/<org>/<servicio>
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: sha256:...
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

env:
  TRIVY_VERSION: "v0.76.2"

jobs:
  image:
    name: Build, escaneo y firma
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      STACK: ${{ inputs.stack }}
      WD: ${{ inputs.working-directory }}
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolver nombre de la imagen
        id: names
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          name="${IMAGE_NAME:-$REPO_NAME}"
          echo "image=ghcr.io/${REPO_OWNER,,}/${name,,}" >> "$GITHUB_OUTPUT"

      - name: Descargar artefacto compilado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-dist
          path: .qt-dist

      - name: Verificar integridad (SHA-256)
        working-directory: .qt-dist
        run: sha256sum -c dist.tar.gz.sha256

      - name: Desempaquetar en el contexto de Docker
        run: |
          case "$STACK" in
            quarkus) mkdir -p "$WD/target" && tar -xzf .qt-dist/dist.tar.gz -C "$WD/target" ;;
            angular) mkdir -p "$WD/dist" && tar -xzf .qt-dist/dist.tar.gz -C "$WD/dist" ;;
            *) echo "::error::Stack desconocido: $STACK"; exit 1 ;;
          esac

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GHCR
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags y labels OCI)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=pr
            type=ref,event=branch
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build${{ inputs.push && ' y push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/Dockerfile
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.artifact-prefix }}-${{ github.event.repository.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.artifact-prefix }}-${{ github.event.repository.name }}

      - name: Referencia a escanear
        id: target
        env:
          PUSHED: ${{ inputs.push }}
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ "$PUSHED" == "true" ]]; then
            echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(head -n1 <<<"$TAGS")" >> "$GITHUB_OUTPUT"
          fi

      - name: Escanear imagen (SARIF)
        if: inputs.scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ steps.target.outputs.ref }}
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      # Los hallazgos quedan como artefacto del run (no se publican en GitHub Security)
      - name: Guardar hallazgos
        if: always() && inputs.scan && hashFiles('trivy-image.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-trivy-image
          path: trivy-image.sarif
          retention-days: 30

      - name: Quality gate de la imagen (HIGH/CRITICAL)
        if: inputs.scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ steps.target.outputs.ref }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Generar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          # Si no hubo escaneo (congelamiento), este paso instala Trivy
          skip-setup-trivy: ${{ inputs.scan }}
          scan-type: image
          image-ref: ${{ steps.target.outputs.ref }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # ---- Solo imágenes publicadas que pasaron el escaneo ----
      - name: Instalar cosign
        if: inputs.push
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Firmar imagen (keyless, Sigstore)
        if: inputs.push
        env:
          REF: ${{ steps.target.outputs.ref }}
        run: cosign sign --yes "$REF"

      - name: Attestation de procedencia (SLSA)
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attestation del SBOM
        if: inputs.push
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Resumen
        if: always()
        env:
          REF: ${{ steps.target.outputs.ref }}
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "### Imagen"
            echo "- Referencia: \`${REF}\`"
            echo "- Publicada, firmada y atestada: ${PUSHED}"
          } >> "$GITHUB_STEP_SUMMARY"
