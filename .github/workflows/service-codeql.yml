# CodeQL (SAST semántico de GitHub). El ruleset de main exige que no haya
# alertas de seguridad HIGH o superiores.
name: service-codeql

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON, p. ej. ["java-kotlin","actions"]'
        type: string
        required: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
