# Historia de usuario ↔ tablero de la organización ↔ rama/PR (repo qt-infra).
name: Project Automation

on:
  issues:
    types: [opened, reopened, assigned, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: project-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  project:
    name: Tablero
    if: vars.PROJECT_NUMBER != ''
    uses: ./.github/workflows/service-project.yml
    permissions:
      contents: read
      id-token: write
