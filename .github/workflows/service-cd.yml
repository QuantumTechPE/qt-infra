# =============================================================================
# CD corporativo de microservicios. Lo llaman, en cada repo de servicio:
#   CICD DEV (cicd-dev.yml)  en cada push a qt/<n>
#   CICD QA  (cicd-qa.yml)   en cada push a master
#
#   qt/<n>  rama de la historia QT-<n> (abierta; sin historia no hay despliegue)
#     build · seguridad · Sonar · imagen ─► DEV          Despliegue DEV → Pruebas DEV
#
#   master  PR aprobado = CONGELAMIENTO
#     build · seguridad · Sonar · imagen ─► release del cambio   vX.Y.Z-rc.N
#                                         + release de reversión (lo que hoy corre en prod)
#                                         + issue de pase
#     QA: congela (cambio) ─► revierte (reversión) ─► recongela (cambio)
#                                                     Congelamiento (doing) → (done)
#
#   El pase a producción (agenda, aprobación de admin, ejecución automática,
#   ratificación o reversión) sigue en el issue de pase: service-pase.yml.
#
# Cada ambiente es un clúster k3s con Argo CD: desplegar es un commit en
# qt-gitops con el digest de la imagen. La MISMA imagen firmada de master va a
# QA y a producción.
# =============================================================================
name: service-cd

on:
  workflow_call:
    inputs:
      stack:
        description: quarkus | angular
        type: string
        required: true
      working-directory:
        type: string
        default: "."
      channel:
        description: "Canal que espera el workflow que llama: dev (CICD DEV) o freeze (CICD QA). Vacío = según la rama"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan (rama e historia)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      code: ${{ steps.plan.outputs.code }}
      issue: ${{ steps.plan.outputs.issue }}
    steps:
      - name: Código de la plataforma (qt-infra)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github
          persist-credentials: false

      - name: Canal de despliegue
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CHANNEL: ${{ inputs.channel }}
        run: bash .qt-infra/.github/scripts/cd-plan.sh

  # ------------------------------------------------------------------ build
  # Validaciones (tests, cobertura, Sonar, seguridad, CVEs de la imagen) SOLO en
  # DEV: el congelamiento empaqueta el mismo código que ya pasó por DEV y por el
  # CI del PR, sin repetirlas.
  build:
    name: Build
    needs: plan
    uses: $/.github/workflows/_build.yml
    with:
      stack: ${{ inputs.stack }}
      working-directory: ${{ inputs.working-directory }}
      validate: ${{ needs.plan.outputs.channel == 'dev' }}

  security:
    name: Seguridad
    needs: plan
    if: needs.plan.outputs.channel == 'dev'
    uses: $/.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write

  sonar:
    name: SonarQube
    needs: [plan, build]
    if: needs.plan.outputs.channel == 'dev'
    uses: $/.github/workflows/_sonar.yml
    with:
      stack: ${{ inputs.stack }}
      working-directory: ${{ inputs.working-directory }}
    permissions:
      contents: read
      id-token: write

  image:
    name: Imagen
    needs: [plan, build, security, sonar]
    # En el congelamiento seguridad y Sonar se saltan: la imagen se construye igual
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.security.result) &&
      contains(fromJSON('["success","skipped"]'), needs.sonar.result)
    uses: $/.github/workflows/_image.yml
    with:
      stack: ${{ inputs.stack }}
      working-directory: ${{ inputs.working-directory }}
      push: true
      scan: ${{ needs.plan.outputs.channel == 'dev' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

  dependency-track:
    name: SBOM → Dependency-Track
    needs: [plan, image]
    if: "!cancelled() && vars.DTRACK_ENABLED == 'true' && needs.image.result == 'success'"
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-sbom
          path: sbom

      - name: API key desde Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          caCertificate: ${{ vars.VAULT_CA_B64 }}
          method: jwt
          path: jwt-github
          role: gha-ci
          jwtGithubAudience: ${{ vars.VAULT_AUDIENCE }}
          secrets: |
            secret/data/ci/dependency-track api_key | DTRACK_API_KEY ;
            secret/data/ci/dependency-track url | DTRACK_URL

      - name: Subir SBOM
        env:
          VERSION: ${{ github.ref_name }}@${{ github.sha }}
          SERVICE: ${{ github.event.repository.name }}
        run: |
          curl -fsS -X POST "${DTRACK_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -F "autoCreate=true" -F "projectName=${SERVICE}" -F "projectVersion=${VERSION}" \
            -F "bom=@sbom/sbom.cdx.json" > /dev/null
          echo "📦 ${SERVICE}@${VERSION} enviado a Dependency-Track" >> "$GITHUB_STEP_SUMMARY"

  # ================================================================== DEV (qt/<n>)
  dev-start:
    name: Tablero · Despliegue DEV
    needs: plan
    if: needs.plan.outputs.channel == 'dev'
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Código de la plataforma (qt-infra)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github
          persist-credentials: false

      - name: Token de la GitHub App
        id: app
        uses: ./.qt-infra/.github/actions/github-app-token
        with:
          vault-addr: ${{ vars.VAULT_ADDR }}
          vault-audience: ${{ vars.VAULT_AUDIENCE }}
          vault-ca: ${{ vars.VAULT_CA_B64 }}

      - name: Historia → Despliegue DEV
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.plan.outputs.issue }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: bash .qt-infra/.github/scripts/story-board.sh start

  dev:
    name: dev
    needs: [plan, image, dev-start]
    if: needs.plan.outputs.channel == 'dev'
    uses: $/.github/workflows/_promote.yml
    with:
      environment: dev
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write

  dev-result:
    name: Tablero · Pruebas DEV
    needs: [plan, dev]
    if: always() && needs.plan.outputs.channel == 'dev'
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Código de la plataforma (qt-infra)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github
          persist-credentials: false

      - name: Token de la GitHub App
        id: app
        uses: ./.qt-infra/.github/actions/github-app-token
        with:
          vault-addr: ${{ vars.VAULT_ADDR }}
          vault-audience: ${{ vars.VAULT_AUDIENCE }}
          vault-ca: ${{ vars.VAULT_CA_B64 }}

      - name: Historia → Pruebas DEV (o In Progress si falló)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.plan.outputs.issue }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          RESULT: ${{ needs.dev.result }}
        run: bash .qt-infra/.github/scripts/story-board.sh result "$RESULT"

  # ================================================================== CONGELAMIENTO (master)
  freeze:
    name: Congelamiento · releases y pase
    needs: [plan, image]
    if: "!cancelled() && needs.plan.outputs.channel == 'freeze' && needs.image.result == 'success'"
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 15
    concurrency:
      group: freeze-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
      reused: ${{ steps.release.outputs.reused }}
      reversion_image: ${{ steps.release.outputs.reversion_image }}
      reversion_digest: ${{ steps.release.outputs.reversion_digest }}
      reversion_commit: ${{ steps.release.outputs.reversion_commit }}
      reversion_label: ${{ steps.release.outputs.reversion_label }}
      issue: ${{ steps.pase.outputs.issue }}
    steps:
      - name: Repo del servicio (historial completo y tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Código de la plataforma (qt-infra)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github
          persist-credentials: false

      - name: Token de la GitHub App (servicio + GitOps)
        id: app
        uses: ./.qt-infra/.github/actions/github-app-token
        with:
          vault-addr: ${{ vars.VAULT_ADDR }}
          vault-audience: ${{ vars.VAULT_AUDIENCE }}
          vault-ca: ${{ vars.VAULT_CA_B64 }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},${{ vars.GITOPS_REPO || 'qt-gitops' }}

      - name: Release del cambio y release de reversión
        id: release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          SERVICE: ${{ github.event.repository.name }}
          GITOPS_REPO: ${{ github.repository_owner }}/${{ vars.GITOPS_REPO || 'qt-gitops' }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: bash .qt-infra/.github/scripts/release.sh freeze

      - name: Issue de pase → Congelamiento (doing)
        id: pase
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PASE_TZ: ${{ vars.PASE_TZ || 'America/Lima' }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.release.outputs.digest }}
          COMMIT: ${{ github.sha }}
          REV_TAG: ${{ steps.release.outputs.reversion_tag }}
          REV_IMAGE: ${{ steps.release.outputs.reversion_image }}
          REV_DIGEST: ${{ steps.release.outputs.reversion_digest }}
          REV_COMMIT: ${{ steps.release.outputs.reversion_commit }}
          REV_LABEL: ${{ steps.release.outputs.reversion_label }}
          STORIES: ${{ steps.release.outputs.stories }}
        run: bash .qt-infra/.github/scripts/pase.sh open

  freeze-assets:
    name: Artefactos del release del cambio
    needs: [freeze, image]
    # El release congelado es inmutable: sus artefactos se publican una sola vez
    if: "!cancelled() && needs.freeze.result == 'success' && needs.freeze.outputs.reused != 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.freeze.outputs.tag }}
      SERVICE: ${{ github.event.repository.name }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-dist
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-sbom
          path: assets

      - name: Verificar integridad y generar SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -c dist.tar.gz.sha256
          mv dist.tar.gz "${SERVICE}-${TAG}.tar.gz"
          mv sbom.cdx.json "${SERVICE}-${TAG}.sbom.cdx.json"
          rm -f dist.tar.gz.sha256
          sha256sum -- * > SHA256SUMS

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Firmar SHA256SUMS (keyless)
        working-directory: assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attestation de procedencia de los binarios
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Adjuntar al release del cambio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          { echo "### Release ${TAG}"; echo '```'; cat assets/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Login en GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag de la imagen (mismo digest, misma firma)
        run: docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"

  qa-congela:
    name: QA · congela
    needs: [freeze, image]
    if: "!cancelled() && needs.freeze.result == 'success'"
    uses: $/.github/workflows/_promote.yml
    with:
      environment: qa
      image: ${{ needs.freeze.outputs.image }}
      digest: ${{ needs.freeze.outputs.digest }}
      version: ${{ needs.freeze.outputs.tag }}
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write

  qa-revierte:
    name: QA · revierte
    needs: [freeze, qa-congela]
    if: "!cancelled() && needs.qa-congela.result == 'success'"
    uses: $/.github/workflows/_promote.yml
    with:
      environment: qa
      image: ${{ needs.freeze.outputs.reversion_image }}
      digest: ${{ needs.freeze.outputs.reversion_digest }}
      version: ${{ needs.freeze.outputs.reversion_label }}
      ref: ${{ needs.freeze.outputs.reversion_commit }}
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write

  qa-recongela:
    name: QA · recongela
    needs: [freeze, image, qa-revierte]
    if: "!cancelled() && needs.qa-revierte.result == 'success'"
    uses: $/.github/workflows/_promote.yml
    with:
      environment: qa
      image: ${{ needs.freeze.outputs.image }}
      digest: ${{ needs.freeze.outputs.digest }}
      version: ${{ needs.freeze.outputs.tag }}
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write

  freeze-result:
    name: Tablero · Congelamiento (done)
    needs: [freeze, qa-congela, qa-revierte, qa-recongela]
    if: always() && needs.freeze.result == 'success'
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Código de la plataforma (qt-infra)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github
          persist-credentials: false

      - name: Token de la GitHub App
        id: app
        uses: ./.qt-infra/.github/actions/github-app-token
        with:
          vault-addr: ${{ vars.VAULT_ADDR }}
          vault-audience: ${{ vars.VAULT_AUDIENCE }}
          vault-ca: ${{ vars.VAULT_CA_B64 }}

      - name: Resultado del congelamiento
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE: ${{ needs.freeze.outputs.issue }}
          TAG: ${{ needs.freeze.outputs.tag }}
          REV_LABEL: ${{ needs.freeze.outputs.reversion_label }}
          CONGELA: ${{ needs.qa-congela.result }}
          REVIERTE: ${{ needs.qa-revierte.result }}
          RECONGELA: ${{ needs.qa-recongela.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { [[ "$1" == "success" ]] && echo "✅" || echo "❌ (${1})"; }
          table="| Paso | En QA | Resultado |
          |---|---|---|
          | Congela | \`${TAG}\` | $(icon "$CONGELA") |
          | Revierte | ${REV_LABEL} | $(icon "$REVIERTE") |
          | Recongela | \`${TAG}\` | $(icon "$RECONGELA") |"
          if [[ "$CONGELA" == success && "$REVIERTE" == success && "$RECONGELA" == success ]]; then
            bash .qt-infra/.github/scripts/pase.sh lane "$ISSUE" "Congelamiento (done)" \
              "🧊 **Congelamiento completo**: el cambio y su reversión funcionan en QA.

          ${table}

          Siguiente: **Pruebas QA**. Si QA no aprueba, comenta \`/rechazar <motivo>\`. Si está conforme, \`/agendar AAAA-MM-DD HH:MM\`."
          else
            gh api -X POST "repos/${REPO}/issues/${ISSUE}/comments" -f body="⚠️ **El congelamiento no terminó** (${RUN_URL}).

          ${table}

          Re-ejecuta los jobs fallidos del run: reutiliza el mismo release y este pase." > /dev/null
            exit 1
          fi
