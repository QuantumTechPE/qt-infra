# CI de qt-infra (check requerido "CI / Gate"): valida todo lo que esta
# plataforma entrega a los microservicios antes de que llegue a master.
name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/infra-checks.yml
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write
