# Historia de usuario ↔ tablero de la organización ↔ rama/PR.
# Lo llama project.yml (issues + pull_request_target) de cada repo.
#   Historia creada → código QT-<n> + Backlog · asignada → rama qt/<n> + In Progress
#   "/rechazar" en pruebas DEV → Rechazo DEV · PR desde qt/<n> → enlazado a la historia
#   (los despliegues y el pase mueven el resto de carriles)
name: service-project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sync:
    name: Sincronizar tablero
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Código de la plataforma (qt-infra)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github
          persist-credentials: false

      - name: Token de la GitHub App
        id: app
        uses: ./.qt-infra/.github/actions/github-app-token
        with:
          vault-addr: ${{ vars.VAULT_ADDR }}
          vault-audience: ${{ vars.VAULT_AUDIENCE }}
          vault-ca: ${{ vars.VAULT_CA_B64 }}

      # Token de Vault para el contador de códigos QT-<n> (KV con check-and-set)
      - name: Token de Vault (códigos de historia)
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          caCertificate: ${{ vars.VAULT_CA_B64 }}
          method: jwt
          path: jwt-github
          role: gha-automation
          jwtGithubAudience: ${{ vars.VAULT_AUDIENCE }}
          exportToken: true

      - name: Actualizar historia, rama y tablero
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_CA_B64: ${{ vars.VAULT_CA_B64 }}
        run: |
          export VAULT_CACERT="${RUNNER_TEMP}/vault-ca.pem"
          base64 -d <<<"$VAULT_CA_B64" > "$VAULT_CACERT"
          bash .qt-infra/.github/scripts/story-flow.sh
