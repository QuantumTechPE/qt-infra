# Interno: análisis en SonarQube (local) + Quality Gate. Corre en el runner
# self-hosted porque SonarQube y Vault viven en la red de la plataforma.
# El proyecto en Sonar se llama igual que el repositorio del microservicio.
name: _sonar

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      working-directory:
        type: string
        default: "."
      artifact-prefix:
        type: string
        default: app

permissions:
  contents: read

jobs:
  analyze:
    name: Análisis y Quality Gate
    runs-on: [self-hosted, linux, qt-platform]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_KEY: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.head_ref }}
      PR_BASE_REF: ${{ github.base_ref }}
      REF_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar necesita historial para "new code" y blame
          persist-credentials: false

      - name: Descargar cobertura (Quarkus)
        if: inputs.stack == 'quarkus'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-reports
          path: ${{ inputs.working-directory }}/target

      - name: Descargar cobertura (Angular)
        if: inputs.stack == 'angular'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-reports
          path: ${{ inputs.working-directory }}/.qt-reports

      - name: Token de SonarQube desde Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          caCertificate: ${{ vars.VAULT_CA_B64 }}
          method: jwt
          path: jwt-github
          role: gha-ci
          jwtGithubAudience: ${{ vars.VAULT_AUDIENCE }}
          secrets: |
            secret/data/ci/sonarqube token | SONAR_TOKEN ;
            secret/data/ci/sonarqube host_url | SONAR_HOST_URL

      # ---------------------------------------------------------------- Quarkus
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: inputs.stack == 'quarkus'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

      - name: Quarkus → SonarQube
        if: inputs.stack == 'quarkus'
        working-directory: ${{ inputs.working-directory }}
        run: |
          # PR → análisis de PR. Push a una rama de historia (qt/<n>) → análisis de rama,
          # para no pisar el de master. Cada valor va como un argumento entre comillas.
          args=("-Dsonar.projectKey=${PROJECT_KEY}" "-Dsonar.projectName=${PROJECT_KEY}")
          if [[ -n "${PR_NUMBER:-}" ]]; then
            args+=("-Dsonar.pullrequest.key=${PR_NUMBER}" "-Dsonar.pullrequest.branch=${PR_HEAD_REF}" "-Dsonar.pullrequest.base=${PR_BASE_REF}")
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            args+=("-Dsonar.branch.name=${REF_NAME}")
          fi
          # Recompila sin tests (Sonar necesita los .class); la cobertura viene del job de build.
          chmod +x mvnw
          ./mvnw -B -ntp --strict-checksums -DskipTests test-compile \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar "${args[@]}"

      # ---------------------------------------------------------------- Angular
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.stack == 'angular'
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      - name: Angular → SonarQube
        if: inputs.stack == 'angular'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.javascript.lcov.reportPaths=.qt-reports/lcov.info
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.head_ref, github.base_ref) || '' }}
            ${{ github.event_name != 'pull_request' && github.ref_name != github.event.repository.default_branch && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}

      - name: Resumen
        if: always()
        run: |
          echo "### SonarQube: ${SONAR_HOST_URL/sonarqube/localhost}/dashboard?id=${PROJECT_KEY}" >> "$GITHUB_STEP_SUMMARY"
