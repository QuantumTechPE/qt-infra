# Convenciones del PR (check requerido "PR Lint / Convenciones"):
# título Conventional Commits y rama qt/<n> de una historia abierta.
# Sin "permissions:" propios: hereda los del llamador (issues: read en los
# micros; qt-gitops solo valida el título).
name: service-pr-lint

on:
  workflow_call:
    inputs:
      require-issue:
        description: Exigir rama qt/<n> de una historia abierta (false en qt-gitops)
        type: boolean
        default: true

jobs:
  lint:
    name: Convenciones
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .qt-infra
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Validar título, rama e historia
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REQUIRE_ISSUE: ${{ inputs.require-issue }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .qt-infra/.github/scripts/pr-lint.sh
