# Interno: seguridad del código (equivalente gratuito a Checkmarx / Xray en CI).
#   - Gitleaks  → secretos en el historial de commits
#   - Semgrep   → SAST (OWASP Top 10, Java, TypeScript, Dockerfile, Kubernetes)
#   - Trivy fs  → SCA (Maven/npm), secretos y misconfiguraciones IaC
# Todo se publica en "Security → Code scanning" (SARIF).
# Bloquean: secretos, SAST severidad ERROR y vulnerabilidades HIGH/CRITICAL con fix.
name: _security

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.186.0"
  TRIVY_VERSION: "v0.76.2"

jobs:
  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks verificando su checksum
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Escanear commits nuevos
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="${BASE_SHA}..${HEAD_SHA}"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then range="$HEAD_SHA"; fi
          cfg=()
          [[ -f .gitleaks.toml ]] && cfg=(--config .gitleaks.toml)
          echo "Rango analizado: $range"
          gitleaks git . "${cfg[@]}" --log-opts="$range" --redact \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1

      # Los hallazgos quedan como artefacto del run (no se publican en GitHub Security)
      - name: Guardar hallazgos
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hallazgos-gitleaks
          path: gitleaks.sarif
          retention-days: 30

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: Analizar
        run: |
          semgrep scan --metrics=off \
            --config p/default --config p/owasp-top-ten \
            --config p/java --config p/typescript --config p/dockerfile --config p/kubernetes \
            --exclude 'node_modules' \
            --sarif --output semgrep.sarif
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          warnings=$(jq '[.runs[].results[] | select(.level == "warning")] | length' semgrep.sarif)
          echo "### Semgrep: ${errors} error(es), ${warnings} warning(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "SEMGREP_ERRORS=${errors}" >> "$GITHUB_ENV"

      # Los hallazgos quedan como artefacto del run (no se publican en GitHub Security)
      - name: Guardar hallazgos
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hallazgos-semgrep
          path: semgrep.sarif
          retention-days: 30

      - name: Quality gate SAST
        run: |
          if [[ "${SEMGREP_ERRORS:-0}" != "0" ]]; then
            echo "::error::Semgrep encontró ${SEMGREP_ERRORS} hallazgo(s) de severidad ERROR. Revisa Security → Code scanning."
            exit 1
          fi

  sca:
    name: SCA e IaC (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      # Sin consultas a Maven Central para resolver poms padre/BOM: desde los
      # runners compartidos responde 429 y bloquea la IP 30 min. Las dependencias
      # Java (transitivas incluidas) se escanean sobre los JAR reales en el
      # escaneo de la imagen (_image.yml).
      TRIVY_OFFLINE_SCAN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Escanear (todas las severidades, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: "**/node_modules"
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      # Los hallazgos quedan como artefacto del run (no se publican en GitHub Security)
      - name: Guardar hallazgos
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hallazgos-trivy-fs
          path: trivy-fs.sarif
          retention-days: 30

      - name: Quality gate HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: "**/node_modules"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
