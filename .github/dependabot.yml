# Dependabot mantiene al día las actions, la plataforma y las PLANTILLAS: cada
# microservicio nuevo nace con dependencias vigentes (los repos de micros traen
# su propio dependabot.yml).
# Los títulos usan Conventional Commits para que pasen el "PR Lint" y entren
# a las notas del release (congelamiento). Igual requieren la aprobación de un admin.
version: 2
updates:
  - package-ecosystem: maven
    directory: /templates/service-quarkus
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      quarkus:
        patterns: ["io.quarkus*"]

  - package-ecosystem: npm
    directory: /templates/service-angular
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "jsdom"]
    # Angular fija el rango de TypeScript (22.x: >=6.0 <6.1). Se actualiza junto con
    # Angular (ng update), nunca por separado.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /templates/service-quarkus
      - /templates/service-angular
      - /platform/toolbox
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(docker)"
    labels: ["dependencies"]

  - package-ecosystem: docker-compose
    directory: /platform
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(platform)"
    labels: ["dependencies"]
