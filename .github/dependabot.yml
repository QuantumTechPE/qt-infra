# Dependabot mantiene al día dependencias, actions e imágenes base.
# Los títulos usan Conventional Commits para que pasen el "PR Lint" y entren
# al changelog de release-please. Igual requieren 2 aprobaciones de admins.
version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies", "area:backend"]
    groups:
      quarkus:
        patterns: ["io.quarkus*"]

  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies", "area:frontend"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "jsdom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "area:infra"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/backend/src/main/docker
      - /apps/frontend
      - /platform/toolbox
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(docker)"
    labels: ["dependencies", "area:infra"]

  - package-ecosystem: docker-compose
    directory: /platform
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(platform)"
    labels: ["dependencies", "area:infra"]
