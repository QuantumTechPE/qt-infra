# Dependency Review: bloquea PRs que agregan dependencias vulnerables o con
# licencias incompatibles con un producto corporativo.
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
license-check: true
deny-licenses:
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - SSPL-1.0
comment-summary-in-pr: on-failure
show-openssf-scorecard: true
